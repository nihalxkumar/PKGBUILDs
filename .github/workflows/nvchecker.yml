name: Check for new versions

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libcurl4-openssl-dev

      - name: Install nvchecker
        run: pip install nvchecker

      - name: Setup nvchecker keyfile
        run: |
          cat > /tmp/keyfile.toml << 'KEYEOF'
          [keys]
          github = '${{ github.token }}'
          KEYEOF

      - name: Save current versions
        run: cp old_versions.json /tmp/old_versions.json

      - name: Run nvchecker
        run: nvchecker -c nvchecker.toml --keyfile /tmp/keyfile.toml

      - name: Detect version changes
        id: detect
        run: |
          # Keep a human-readable diff for the PR body.
          diff -u /tmp/old_versions.json old_versions.json > /tmp/diff_output.txt || true
          # Compare the two nvchecker JSON files directly. Relying on the unified
          # diff is fragile: on a version bump only the "version" line is marked
          # with "+", while the package-name line stays as unchanged context, so
          # scraping package names from "+" lines never matched and the version
          # map ended up empty.
          rm -f /tmp/version_map.txt
          python3 - <<'PY'
          import json

          def load(path):
              with open(path) as f:
                  return json.load(f).get("data", {})

          old = load("/tmp/old_versions.json")
          new = load("old_versions.json")

          changed = []
          for pkg, info in new.items():
              ver = info.get("version")
              if ver and old.get(pkg, {}).get("version") != ver:
                  changed.append((pkg, ver))

          with open("/tmp/version_map.txt", "w") as f:
              for pkg, ver in changed:
                  f.write(f"{pkg}:{ver}\n")

          import os
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              if changed:
                  out.write("UPDATES_FOUND=true\n")
                  out.write("PACKAGES=" + ",".join(p for p, _ in changed) + "\n")
          PY

      - name: Configure git
        if: steps.detect.outputs.UPDATES_FOUND == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create update branch
        if: steps.detect.outputs.UPDATES_FOUND == 'true'
        run: |
          git checkout -B auto-update

      - name: Update packages
        if: steps.detect.outputs.UPDATES_FOUND == 'true'
        run: |
          rm -f /tmp/package_inspections.md
          rm -f /tmp/successfully_updated.txt
          while IFS=: read -r pkg ver; do
            echo "Updating ${pkg} to ${ver}"
            if python3 scripts/update-package.py "${pkg}" "${ver}"; then
              echo "${pkg}:${ver}" >> /tmp/successfully_updated.txt
              # One commit per package. aurpublish pushes the subtree of commits
              # that touched a package dir, so this message becomes the AUR log
              # entry -- the classic "upgpkg: <pkgname> <pkgver>-<pkgrel>".
              pkgver=$(sed -n 's/^[[:space:]]*pkgver = //p' "${pkg}/.SRCINFO" | head -n1)
              pkgrel=$(sed -n 's/^[[:space:]]*pkgrel = //p' "${pkg}/.SRCINFO" | head -n1)
              git add "${pkg}"
              git commit -q -m "upgpkg: ${pkg} ${pkgver}-${pkgrel}"
            else
              echo "::warning title=Update failed::Failed to update ${pkg} to ${ver}"
              python3 -c "import json, sys; p, f1, f2 = sys.argv[1:4]; o = json.load(open(f1)).get('data', {}); n = json.load(open(f2)); p in o and n.get('data', {}).__setitem__(p, o[p]); open(f2, 'w').write(json.dumps(n, indent=2) + '\n')" "${pkg}" /tmp/old_versions.json old_versions.json
              # Drop any half-written edits so a failed update never ships.
              git checkout -- "${pkg}"
            fi
          done < /tmp/version_map.txt
          # Bookkeeping is committed last, so versions of packages that failed
          # above (and were rolled back) are not recorded as updated.
          if ! git diff --quiet -- old_versions.json; then
            git add old_versions.json
            git commit -q -m "chore(nvchecker): record updated versions"
          fi
          mv /tmp/successfully_updated.txt /tmp/version_map.txt 2>/dev/null || touch /tmp/version_map.txt
          if [ -s /tmp/package_inspections.md ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
            cat /tmp/package_inspections.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push update branch
        if: steps.detect.outputs.UPDATES_FOUND == 'true'
        run: |
          if git diff --quiet origin/main..HEAD; then
            echo "No changes to commit"
            exit 0
          fi
          git push --force origin auto-update

      - name: Create or update pull request
        if: steps.detect.outputs.UPDATES_FOUND == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT || github.token }}
        run: |
          {
            echo "### Updated packages"
            while IFS=: read -r pkg ver; do
              echo "- **${pkg}**: ${ver}"
            done < /tmp/version_map.txt
            echo ""
            echo "### Version diff"
            echo '```diff'
            cat /tmp/diff_output.txt
            echo '```'
            if [ -s /tmp/package_inspections.md ]; then
              echo ""
              echo "### Asset inspection & validation"
              cat /tmp/package_inspections.md
            fi
          } > /tmp/pr_body.txt

          current_user=$(gh api user -q .login 2>/dev/null || echo "")
          repo_owner="${{ github.repository_owner }}"
          edit_reviewer_args=()
          create_reviewer_args=()
          if [ -n "$repo_owner" ] && [ "$current_user" != "$repo_owner" ]; then
            edit_reviewer_args=(--add-reviewer "$repo_owner")
            create_reviewer_args=(--reviewer "$repo_owner")
          fi

          pr_number=$(gh pr list --head auto-update --state open --json number --jq '.[0].number')
          if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
            echo "Updating description for existing PR #${pr_number}"
            gh pr edit "$pr_number" \
              --body-file /tmp/pr_body.txt \
              "${edit_reviewer_args[@]}"
          else
            echo "Creating new PR"
            gh pr create \
              --title "auto: update packages" \
              --body-file /tmp/pr_body.txt \
              --head auto-update \
              --base main \
              --label dependencies,automated \
              "${create_reviewer_args[@]}"
          fi
